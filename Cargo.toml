[package]
name = "ctx"
version = "0.1.0"
edition = "2024"
description = "Version-controlled workflow context for codebases, with explicit concerns, scope, and supersession"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/African-Pelagic/ctx"
homepage = "https://github.com/African-Pelagic/ctx"
keywords = ["cli", "context", "agents", "knowledge-management", "git"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
dialoguer = "0.11"
glob = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
